[Config General2]
description = Using Cars instead of Drones 
extends = General
network = ThesisD 

*.BuildingA.numApps = 1
*.BuildingA.app[0].typename = "UdpBasicApp"
*.BuildingA.app[0].destAddresses = "BuildingE"
*.BuildingA.app[0].messageLength = 1000B  
*.BuildingA.app[0].sendInterval = 1s
*.BuildingA.app[0].destPort = 5000

*.BuildingE.numApps = 1
*.BuildingE.app[0].typename = "UdpSink"
*.BuildingE.app[0].localPort = 5000

# ---------------------- ΕΜΒΕΛΕΙΑ ΣΗΜΑΤΩΝ ----------------------
*.Building*.wlan[0].radio.transmitter.power = 2mW

*.car*.wlan[0].radio.transmitter.power = 1.3mW

# ---------- ΧΡΗΣΗ AODV ΩΣ ΠΡΩΤΟΚΟΛΛΟ ΔΡΟΜΟΛΟΓΗΣΗΣ -------------
*.**.routingTable.typename = "AodvRouting"
*.*.routingApp.typename = "Aodv"
*.Building*.typename = "AodvRouter"
*.car*.typename = "AodvRouter"

*.**.aodv.helloInterval = 0.5s
*.**.aodv.activeRouteTimeout = 1.5s
*.**.aodv.allowedHelloLoss = 1

#----------------- ΚΙΝΗΣΗ ΑΥΤΟΚΙΝΗΤΩΝ ----------------------
*.visualizer.mobilityVisualizer.displayMobility = true
*.environment.ground.typename = "FlatGround"

*.car*.mobility.typename = "VehicleMobility"
*.car*.mobility.waypointProximity = 3m
*.car*.mobility.speed = uniform(20mps,40mps)
*.car*.mobility.groundModule = "environment.ground"

*.car*.mobility.updateInterval = 0.05s

*.car1.mobility.waypointFile = "car1.txt"
