[Config General]
description = General Network Configurations
network = ThesisA

sim-time-limit = 300s  # Χρονικό όριο προσομοίωσης
*.scalar-recording = true  # Καταγραφή στατιστικών
*.vector-recording = true 

*.routingTableRecorder.enabled = true 

# ---------------------- ΔΙΚΤΥΑΚΕΣ ΡΥΘΜΙΣΕΙΣ ----------------------
*.configurator.addStaticRoutes = false
**.netmaskRoutes = ""
**.arp.typename = "GlobalArp"
*.**.**.bitrate = 24Mbps
*.configurator.optimizeRoutes = true
*.**.forwarding = true

# ---------------------- ΕΜΒΕΛΕΙΑ ΣΗΜΑΤΩΝ ----------------------
*.Building*.wlan[0].radio.transmitter.power = 2mW

*.drone*.wlan[0].radio.transmitter.power = 3mW

*.BuildingA.wlan[0].radio.displayInterferenceRange = true

# ------------- ΜΟΝΤΕΛΟ ΑΠΩΛΕΙΩΝ ΣΗΜΑΤΟΣ ------------
*.radioMedium.pathLoss.typename = "LogNormalShadowing"
*.radioMedium.pathLoss.systemLoss = 5dB

#----------------- ANTENNA GAIN -----------------------
*.**.wlan[0].radio.antenna.typename = "ConstantGainAntenna"
*.**.wlan[0].radio.antenna.gain = 3dB

#-------------- ENERRGY CONSUMPTION ----------------
*.**.wlan[0].radio.energyConsumer.typename = "StateBasedEpEnergyConsumer"
*.**.wlan[0].radio.energyConsumer.offPowerConsumption = 0mW
*.**.wlan[0].radio.energyConsumer.sleepPowerConsumption = 1mW
*.**.wlan[0].radio.energyConsumer.switchingPowerConsumption = 1mW
*.**.wlan[0].radio.energyConsumer.receiverIdlePowerConsumption = 2mW
*.**.wlan[0].radio.energyConsumer.receiverBusyPowerConsumption = 5mW
*.**.wlan[0].radio.energyConsumer.receiverReceivingPowerConsumption = 10mW
*.**.wlan[0].radio.energyConsumer.transmitterIdlePowerConsumption = 2mW
*.**.wlan[0].radio.energyConsumer.transmitterTransmittingPowerConsumption = 100mW

*.**.energyStorage.typename = "IdealEpEnergyStorage"

*.**.wlan[0].radio.displayInterferenceRange = false

# ---------------------- ΟΠΤΙΚΟΠΟΙΗΣΗ (ANIMATIONS) ----------------------
*.visualizer.typename = "IntegratedCanvasVisualizer"
*.visualizer.signalVisualizer.typename = "SignalCanvasVisualizer"
*.visualizer.mediumVisualizer.displaySignals = true
*.visualizer.packetDropVisualizer.typename = "PacketDropCanvasVisualizer"
*.visualizer.communicationRangeVisualizer.typename = "CommunicationRangeCanvasVisualizer"
*.**.wlan[0].radio.displayCommunicationRange = true
*.visualizer.physicalLinkVisualizer.packetFilter = "UDPData*"

*.visualizer.mobilityVisualizer.typename = "MobilityCanvasVisualizer"
*.visualizer.mobilityVisualizer.displayMovementTrails = true
*.visualizer.networkRouteVisualizer.displayRoutes = true
*.visualizer.dataLinkVisualizer.packetFilter = "AODV*"


[Config General1]
description = General 1 basic scenario with drones
extends = General 

# ---------------------- ΔΙΑΚΙΝΗΣΗ ΔΕΔΟΜΕΝΩΝ ----------------------
*.BuildingA.numApps = 1
*.BuildingA.app[0].typename = "UdpBasicApp"
*.BuildingA.app[0].destAddresses = "BuildingB"
*.BuildingA.app[0].messageLength = 1000B  
*.BuildingA.app[0].sendInterval = 1s
*.BuildingA.app[0].destPort = 5000

*.BuildingB.numApps = 1
*.BuildingB.app[0].typename = "UdpSink"
*.BuildingB.app[0].localPort = 5000

*.**.app[0].packetSent.vector-recording = true
*.**.app[0].packetSent.scalar-recording = true
*.**.app[0].packetReceived.scalar-recording = true
*.**.app[0].packetReceived.vector-recording = true


# ---------------------- ΚΙΝΗΣΗ DRONES ----------------------
*.drone*.mobility.typename = "LinearMobility"

*.drone*.mobility.speed = 10mps

*.drone*.mobility.initialZ = 50m

*.drone1.mobility.constraintAreaMinX = 410m   
*.drone1.mobility.constraintAreaMaxX = 700m 

*.drone2.mobility.constraintAreaMinX = 500m   
*.drone2.mobility.constraintAreaMaxX = 800m 

*.drone3.mobility.constraintAreaMinX = 750m   
*.drone3.mobility.constraintAreaMaxX = 1010m 
 
*.drone4.mobility.constraintAreaMinX = 970m   
*.drone4.mobility.constraintAreaMaxX = 1250m 

*.drone5.mobility.constraintAreaMinX = 1350m   
*.drone5.mobility.constraintAreaMaxX = 1550m 

*.drone*.mobility.constraintAreaMinY = 400m   
*.drone*.mobility.constraintAreaMaxY = 800m 

*.drone1.mobility.initialMovementHeading = uniform(230deg, 300deg)  
*.drone2.mobility.initialMovementHeading = uniform(230deg, 300deg)  
*.drone3.mobility.initialMovementHeading = uniform(230deg, 300deg) 
*.drone4.mobility.initialMovementHeading = uniform(230deg, 300deg)
*.drone5.mobility.initialMovementHeading = uniform(230deg, 300deg)

*.drone*.mobility.vector-recording = true

# ----------------- ΧΡΗΣΗ AODV ΩΣ ΠΡΩΤΟΚΟΛΛΟ ΔΡΟΜΟΛΟΓΗΣΗΣ ----------
*.**.routingTable.typename = "AodvRouting"
*.*.routingApp.typename = "Aodv"
*.Building*.typename = "AodvRouter"
*.drone*.typename = "AodvRouter"

